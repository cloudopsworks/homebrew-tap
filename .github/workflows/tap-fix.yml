name: brew tap-fix

on:
  pull_request:

jobs:
  tap-fix:
    # Fork PRs still get the read-only style check in test-bot.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main

      - name: Fix style on the PR head
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # setup-homebrew checks out the PR merge commit, not the contributor's commit.
          git checkout --detach "$PR_HEAD_SHA"
          brew style --fix .
          if git diff --quiet; then
            echo "No style fixes needed."
            exit 0
          fi

          git commit -am "fix: brew style fix"
          # Publish only if the branch still exists at the revision we formatted.
          git push --force-with-lease="refs/heads/$PR_BRANCH:$PR_HEAD_SHA" origin "HEAD:refs/heads/$PR_BRANCH"
